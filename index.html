<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuratore SWAN</title>
  
  <!-- Configurazione PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2A85A8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1087/1087815.png">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  
  <style>
    /* ==========================================
       VARIABLES & DESIGN SYSTEM
       ========================================== */
    :root { 
        --primary: #2A85A8; 
        --bg: #F8FAFC; 
        --dark: #0F172A; 
        --border: #E2E8F0; 
        --success: #10B981;
        --danger: #EF4444;
        --warning-bg: #FFF9C4;
        --warning-border: #F0E68C;
        --warning-text: #856404;
    }

    /* ==========================================
       BASE & LAYOUT
       ========================================== */
    body, html { 
        margin: 0; 
        padding: 0; 
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
        background: var(--bg); 
        overflow: hidden; 
        height: 100%; 
        color: #334155; 
    }

    /* Pages transition framework */
    .page { 
        position: absolute; 
        top: 0; 
        left: 0; 
        width: 100%; 
        height: 100%; 
        background: var(--bg); 
        transition: transform 0.6s cubic-bezier(0.85, 0, 0.15, 1); 
        overflow-y: auto; 
        display: flex; 
        flex-direction: column; 
    }
    .page-hidden-up { transform: translateY(-100%); }
    .page-hidden-down { transform: translateY(100%); }
    .page-visible { transform: translateY(0); }

    /* Core Container */
    .container { 
        width: 95%; 
        max-width: 1100px; 
        margin: 20px auto 100px auto; 
        padding: 40px; 
        background: #FFFFFF; 
        border-radius: 24px; 
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.04); 
        box-sizing: border-box; 
    }

    .header-form { 
        text-align: center; 
        margin-bottom: 40px; 
    }

    .grid-3 { 
        display: grid; 
        grid-template-columns: repeat(3, 1fr); 
        gap: 20px; 
        margin-bottom: 20px; 
    }

    /* ==========================================
       COMPONENTS & BUTTONS
       ========================================== */
    .btn-main { 
        padding: 16px 32px; 
        border-radius: 12px; 
        border: none; 
        background: var(--primary); 
        color: #FFFFFF; 
        font-weight: 800; 
        font-size: 1rem; 
        cursor: pointer; 
        transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease; 
        box-shadow: 0 4px 15px rgba(42, 133, 168, 0.3); 
    }
    .btn-main:hover { 
        transform: translateY(-2px); 
    }
    .btn-outline { 
        background: #FFFFFF; 
        color: var(--primary); 
        border: 2px solid var(--primary); 
        box-shadow: none;
    }
    .btn-resume { 
        background: var(--success); 
        color: #FFFFFF; 
        border: none; 
        box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); 
    }

    .input-premium { 
        width: 100%; 
        padding: 16px; 
        border-radius: 12px; 
        border: 2px solid var(--border); 
        font-size: 1rem; 
        box-sizing: border-box; 
        font-family: inherit;
    }
    .input-premium[readonly] { 
        background: #EDF2F7 !important; 
        color: #718096; 
        border-color: #CBD5E1; 
        cursor: not-allowed; 
    }

    .field-group label { 
        display: block; 
        font-weight: 800; 
        color: var(--primary); 
        margin-bottom: 8px; 
        font-size: 0.8rem; 
        text-transform: uppercase;
    }

    /* ==========================================
       AREAS & MENUS STRUCTURE
       ========================================== */
    .erp-global-row { 
        background: #F8FAFC; 
        padding: 20px; 
        border-radius: 16px; 
        border: 2px solid var(--border); 
        margin-bottom: 30px; 
        display: flex; 
        align-items: center; 
        gap: 20px; 
    }

    .area-box { 
        margin-bottom: 25px; 
        border: 2px solid var(--border); 
        border-radius: 20px; 
        background: #FFFFFF; 
        overflow: hidden; 
    }
    .area-header { 
        background: #F8FAFC; 
        padding: 20px 30px; 
        cursor: pointer; 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        border-bottom: 1px solid var(--border); 
    }
    .area-header h2 { 
        margin: 0; 
        color: var(--dark); 
        font-size: 1.2rem; 
        font-weight: 800; 
        text-transform: uppercase; 
    }
    .area-content { 
        max-height: 0; 
        overflow: hidden; 
        transition: max-height 0.5s ease-in-out; 
    }
    .area-content.open { 
        max-height: 15000px; 
    }
    .area-inner { 
        padding: 30px; 
    }

    .menu-box { 
        margin-bottom: 40px; 
    }
    .menu-header { 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        border-bottom: 3px solid var(--primary); 
        padding-bottom: 10px; 
        margin-bottom: 15px; 
    }
    .menu-header h3 { 
        margin: 0; 
        color: var(--primary); 
        font-size: 1.1rem; 
        text-transform: uppercase; 
    }

    .sub-menu-container { 
        margin-bottom: 20px; 
        padding-left: 15px; 
        border-left: 3px solid #F1F5F9; 
    }
    .sub-menu-header { 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        background: #F8FAFC; 
        padding: 8px 15px; 
        border-radius: 8px; 
        margin-bottom: 10px; 
    }
    .sub-menu-title { 
        font-weight: 800; 
        color: #64748B; 
        font-size: 0.8rem; 
        text-transform: uppercase; 
    }

    .btn-select { 
        padding: 5px 12px; 
        font-size: 0.7rem; 
        background: #FFFFFF; 
        color: var(--primary); 
        border: 1.5px solid var(--primary); 
        border-radius: 6px; 
        cursor: pointer; 
        font-weight: 800; 
        transition: background 0.2s, color 0.2s;
    }
    .btn-select.active { 
        background: var(--primary); 
        color: #FFFFFF; 
    }

    /* ==========================================
       FUNCTION ROWS & CONTROLS
       ========================================== */
    .func-row-wrapper { 
        border-bottom: 1px solid #F1F5F9; 
        padding: 10px 0; 
    }
    .func-row-main { 
        display: flex; 
        align-items: center; 
        gap: 15px; 
        padding: 5px 15px; 
        transition: background 0.2s; 
    }
    .func-row-main.active { 
        background: #F0F9FF; 
        border-radius: 8px; 
    }
    .func-name { 
        flex: 1; 
        font-weight: 600; 
        font-size: 0.95rem; 
    }
    
    .func-controls { 
        display: flex; 
        align-items: center; 
        gap: 12px; 
    }

    .select-level { 
        padding: 6px 12px; 
        border-radius: 8px; 
        border: 2px solid #CBD5E1; 
        font-weight: 700; 
        color: var(--dark); 
        cursor: pointer; 
        background: #FFFFFF; 
        font-family: inherit; 
        font-size: 0.85rem; 
    }

    /* Notes System */
    .btn-note { 
        position: relative; 
        padding: 6px 12px; 
        border-radius: 8px; 
        border: 1.5px solid #CBD5E1; 
        background: #FFFFFF; 
        font-weight: 800; 
        cursor: pointer; 
        font-size: 0.75rem; 
        color: #64748B; 
    }
    .btn-note.note-active { 
        background: var(--warning-bg); 
        border-color: var(--warning-border); 
        color: var(--warning-text); 
    }
    .badge-note { 
        position: absolute; 
        top: -5px; 
        right: -5px; 
        width: 100px; 
        height: 10px; 
        background: var(--danger); 
        border-radius: 50%; 
        display: none; 
        border: 1.5px solid #FFFFFF; 
    }
    
    .note-container { 
        width: 100%; 
        display: none; 
        padding: 10px 15px 5px 15px; 
    }
    .note-container textarea { 
        width: 100%; 
        padding: 12px; 
        border-radius: 10px; 
        border: 2px solid var(--warning-border); 
        background: #FFFDE7; 
        box-sizing: border-box; 
        font-family: inherit; 
        font-size: 0.9rem; 
        resize: vertical; 
    }

    /* Switches & Toggles */
    .erp-toggle-wrapper { 
        display: none; 
        align-items: center; 
        gap: 8px; 
        background: #EDF2F7; 
        padding: 5px 10px; 
        border-radius: 8px; 
        border: 1px solid #CBD5E1; 
    }
    .switch { 
        position: relative; 
        display: inline-block; 
        width: 34px; 
        height: 20px; 
    }
    .switch input { 
        opacity: 0; 
        width: 0; 
        height: 0; 
    }
    .slider { 
        position: absolute; 
        cursor: pointer; 
        top: 0; left: 0; right: 0; bottom: 0; 
        background-color: #CBD5E1; 
        transition: .4s; 
        border-radius: 20px; 
    }
    .slider:before { 
        position: absolute; 
        content: ""; 
        height: 14px; 
        width: 14px; 
        left: 3px; 
        bottom: 3px; 
        background-color: #FFFFFF; 
        transition: .4s; 
        border-radius: 50%; 
    }
    input:checked + .slider { 
        background-color: var(--primary); 
    }
    input:checked + .slider:before { 
        transform: translateX(14px); 
    }

    /* System Status Elements */
    .success-id { 
        font-size: 3.5rem; 
        font-weight: 800; 
        color: var(--primary); 
        margin: 20px 0; 
        background: #F1F5F9; 
        padding: 20px; 
        border-radius: 12px; 
    }
    #offline-banner { 
        display: none; 
        position: fixed; 
        top: 0; 
        left: 0; 
        width: 100%; 
        background: var(--danger); 
        color: #FFFFFF; 
        text-align: center; 
        padding: 6px; 
        font-weight: 800; 
        font-size: 0.8rem; 
        z-index: 100000; 
    }

    /* ==========================================
       BOTTOM DOCK & DRAWER
       ========================================== */
    .bottom-bar { 
        position: fixed; 
        bottom: 0; 
        left: 0; 
        width: 100%; 
        background: rgba(15, 23, 42, 0.95); 
        backdrop-filter: blur(10px); 
        padding: 12px 20px; 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        z-index: 1000; 
        box-sizing: border-box; 
        border-top: 1px solid rgba(255, 255, 255, 0.1); 
    }

    .dock-taglia-btn { 
        display: flex; 
        align-items: center; 
        gap: 10px; 
        background: rgba(255, 255, 255, 0.1); 
        padding: 8px 14px; 
        border-radius: 30px; 
        cursor: pointer; 
        color: #FFFFFF; 
        transition: transform 0.2s ease, background 0.2s ease; 
    }
    .dock-taglia-btn:active { 
        transform: scale(0.95); 
    }

    .dock-badge { 
        background: var(--success); 
        color: #FFFFFF; 
        font-weight: 800; 
        padding: 4px 10px; 
        border-radius: 20px; 
        font-size: 0.85rem; 
    }
    .dock-info { 
        font-size: 0.85rem; 
        font-weight: 600; 
        color: #E2E8F0; 
    }
    .dock-arrow { 
        font-size: 0.7rem; 
        opacity: 0.7; 
        color: #94A3B8; 
    }

    /* Drawer Modal Overlay & Card */
    .drawer-overlay { 
        position: fixed; 
        top: 0; left: 0; 
        width: 100%; height: 100%; 
        background: rgba(0, 0, 0, 0.5); 
        backdrop-filter: blur(4px); 
        opacity: 0; 
        pointer-events: none; 
        transition: opacity 0.3s ease; 
        z-index: 1001; 
    }
    .drawer-overlay.active { 
        opacity: 1; 
        pointer-events: auto; 
    }

    .drawer-card { 
        position: fixed; 
        bottom: -100%; 
        left: 0; 
        width: 100%; 
        background: #FFFFFF; 
        border-radius: 24px 24px 0 0; 
        padding: 24px; 
        box-sizing: border-box; 
        transition: bottom 0.4s cubic-bezier(0.1, 1, 0.1, 1); 
        z-index: 1002; 
        box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.15); 
    }
    .drawer-card.active { 
        bottom: 0; 
    }

    .drawer-handle { 
        width: 40px; 
        height: 5px; 
        background: #E2E8F0; 
        border-radius: 10px; 
        margin: 0 auto 16px auto; 
    }
    .drawer-title { 
        font-size: 0.8rem; 
        font-weight: 800; 
        text-transform: uppercase; 
        color: #64748B; 
        margin-bottom: 8px; 
    }
    .drawer-taglia { 
        font-size: 2rem; 
        font-weight: 800; 
        color: var(--primary); 
        margin: 0 0 16px 0; 
    }
    
    .drawer-grid { 
        display: grid; 
        grid-template-columns: repeat(2, 1fr); 
        gap: 12px; 
        margin-bottom: 20px; 
    }
    .drawer-item { 
        background: #F8FAFC; 
        padding: 12px; 
        border-radius: 12px; 
        border: 1px solid var(--border); 
    }
    .drawer-item span { 
        display: block; 
        font-size: 0.75rem; 
        color: #64748B; 
        font-weight: 700; 
    }
    .drawer-item strong { 
        font-size: 1.1rem; 
        color: var(--dark); 
    }

    /* ==========================================
       RESPONSIVE DESIGN (MOBILE OPTIMIZATION)
       ========================================== */
    @media screen and (max-width: 768px) {
        .container { 
            width: 98% !important; 
            margin: 10px auto 90px auto !important; 
            padding: 15px !important; 
            border-radius: 16px !important; 
        }
        .grid-3 { 
            grid-template-columns: 1fr !important; 
            gap: 12px !important; 
        }
        .erp-global-row { 
            flex-direction: column !important; 
            align-items: flex-start !important; 
            gap: 10px !important; 
            padding: 15px !important; 
        }
        .area-header { 
            padding: 15px !important; 
        }
        .area-header h2 { 
            font-size: 1rem !important; 
        }
        .area-inner { 
            padding: 12px 8px !important; 
        }
        .sub-menu-container { 
            padding-left: 8px !important; 
        }
        .func-row-main { 
            flex-direction: column !important; 
            align-items: flex-start !important; 
            gap: 10px !important; 
            padding: 10px !important; 
        }
        .func-controls { 
            width: 100% !important; 
            justify-content: space-between !important; 
            flex-wrap: wrap !important; 
        }
        .select-level { 
            font-size: 0.8rem !important; 
            padding: 4px 8px !important; 
        }
        .btn-main { 
            width: auto !important; 
            padding: 12px 18px !important; 
            font-size: 0.9rem !important; 
        }
        .success-id { 
            font-size: 1.8rem !important; 
            padding: 12px !important; 
            word-break: break-all; 
        }
    }
</style>
</head>
<body>

<div id="offline-banner">SEI OFFLINE - Le modifiche verranno salvate in locale</div>

<!-- LANDING PAGE -->
<div id="landing-page" class="page page-visible">
  <div style="margin: auto; text-align: center;">
    <img src="" alt="SWAN Logo" style="max-width: 200px; margin-bottom: 20px; display: block; margin-left: auto; margin-right: auto;">
    
    <h1 style="color: var(--dark); font-weight: 800;">Configuratore SWAN</h1>
    <div style="margin-top: 40px; display: flex; flex-direction: column; align-items: center; gap: 15px;">
      <div style="display: flex; gap: 20px;">
        <button class="btn-main" onclick="startNewConfig()">Nuova Configurazione</button>
        <button class="btn-main btn-outline" onclick="toggleRecallBox()">Recupera Esistente</button>
      </div>
      <button id="btn-resume-draft" class="btn-main btn-resume" style="display: none; width: 440px;" onclick="resumeDraft()">Continua la configurazione iniziata</button>
    </div>
    <div id="recall-box" style="display: none; margin-top: 20px; background: white; padding: 20px; border-radius: 12px; border: 1px solid #ddd;">
      <input type="text" id="recall-input" class="input-premium" placeholder="ID RICHIESTA" style="width: 200px; text-align: center;">
      <button class="btn-main" onclick="doRecall()" style="margin-top:10px; width:100%;">Cerca</button>
    </div>
  </div>
</div>

<!-- MAIN APPLICATION -->
<div id="main-app" class="page page-hidden-down">
  <div class="container">
    <div class="header-form">
      <img src="" alt="SWAN Logo" style="max-width: 140px; margin-bottom: 15px; display: block; margin-left: auto; margin-right: auto;">
      <h2 style="font-weight: 800; text-transform: uppercase;">Configurazione Moduli</h2>
    </div>
    <form id="swanForm" onchange="autoSave()">
      <input type="hidden" id="config_id" name="config_id">
      <div class="grid-3">
        <div class="field-group"><label>CLIENTE / AZIENDA</label><input type="text" id="azienda" name="azienda" class="input-premium"></div>
        <div class="field-group"><label>REFERENTE CLIENTE</label><input type="text" id="nome" name="nome" class="input-premium"></div>
        <div class="field-group"><label>COMPILATO DA</label><input type="text" id="compilatore" name="compilatore" class="input-premium" placeholder="Es. Nome PM / Account"></div>
      </div>
      <div class="erp-global-row">
        <label style="font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 10px;">
          <input type="checkbox" id="usa_erp_globale" name="usa_erp_globale" onchange="handleGlobalERP()" style="width:18px; height:18px;"> Si utilizza un ERP?
        </label>
        <input type="text" id="nome_erp_master" name="nome_erp_master" class="input-premium" placeholder="Nome ERP" style="display: none; flex: 1;">
      </div>
      <div id="builder-container"></div>
    </form>
  </div>

  <!-- BARRA INFERIORE FLUTTUANTE (DOCK) -->
  <div class="bottom-bar">
    <div class="dock-taglia-btn" onclick="toggleDrawer(true)">
      <span class="dock-badge" id="dock-taglia-val">Taglia S</span>
      <span class="dock-info" id="dock-sforzo-val">0.0 gg</span>
      <span class="dock-arrow">▲ Dettagli</span>
    </div>
    
    <button type="button" class="btn-main" id="btn-save" onclick="saveConfiguration()">
      Salva Configurazione
    </button>
  </div>

  <!-- DRAWER MODALE DETTAGLI -->
  <div class="drawer-overlay" id="drawer-overlay" onclick="toggleDrawer(false)"></div>
  <div class="drawer-card" id="drawer-card">
    <div class="drawer-handle"></div>
    <div class="drawer-title">STIMA CONFIGURAZIONE SWAN</div>
    <div class="drawer-taglia" id="drawer-taglia-txt">Taglia S</div>
    
    <div class="drawer-grid">
      <div class="drawer-item">
        <span>SFORZO TOTALE</span>
        <strong id="drawer-sforzo-txt">0.0 gg u.</strong>
      </div>
      <div class="drawer-item">
        <span>GO-LIVE STIMATO</span>
        <strong id="drawer-golive-txt">--/--/----</strong>
      </div>
    </div>
    
    <button type="button" class="btn-main btn-outline" style="width:100%" onclick="toggleDrawer(false)">
      Chiudi Dettagli
    </button>
  </div>
</div>

<!-- SUCCESS PAGE -->
<div id="success-page" class="page page-hidden-down">
  <div style="margin: auto; text-align: center;">
    <div class="success-id" id="final-id">----</div>
    <div id="info-success-box" style="margin: 20px auto; max-width: 500px; background: #EBF8FF; padding: 15px; border-radius: 12px; border: 2px solid #BEE3F8; color: #2B6CB0; font-weight: 600; font-size: 1.05rem;"></div>
    <p style="font-size: 1.2rem; color: #94A3B8; margin-bottom: 50px;">COPIA ID PER RECUPERARE LA CONFIGURAZIONE</p>
    <button class="btn-main" style="margin-top:30px;" onclick="resetAndHome()">Torna al Menu Principale</button>
  </div>
</div>

<script>
  // URL DELL'API GOOGLE APPS SCRIPT
  const API_URL = "https://script.google.com/macros/s/AKfycbzBE_7yPlPqJSk99lxTGAjWs52_lGdTj4-xlVwMN7cYSOS4eq0YVfFqLzuF16TRNjg/exec"; 

  let configStructure = [];
  let isDataLoaded = false;

  window.onload = () => {
    checkDraft();
    initNetworkMonitor();
    loadStructure();
  };

  function loadStructure() {
    fetch(`${API_URL}?action=getStructure`, { redirect: 'follow' })
      .then(res => res.json())
      .then(res => {
        if (!Array.isArray(res) || res.length === 0) {
          console.warn("Dati vuoti ricevuti dall'API Google Sheet");
          loadStructureFromCache();
          return;
        }
        configStructure = res;
        isDataLoaded = true;
        localStorage.setItem('swan_structure_cache', JSON.stringify(res));
      })
      .catch(err => {
        console.error("Errore fetch API:", err);
        loadStructureFromCache();
      });
  }

  function loadStructureFromCache() {
    const cached = localStorage.getItem('swan_structure_cache');
    if (cached) {
      configStructure = JSON.parse(cached);
      isDataLoaded = true;
    }
  }

  function initNetworkMonitor() {
    const updateOnlineStatus = () => {
      const banner = document.getElementById('offline-banner');
      if (banner) banner.style.display = navigator.onLine ? 'none' : 'block';
    };
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();
  }

  function checkDraft() {
    const draft = localStorage.getItem('swan_draft');
    if (draft) document.getElementById('btn-resume-draft').style.display = 'block';
  }

  function autoSave() {
    const formData = {};
    document.querySelectorAll('#swanForm input, #swanForm select, #swanForm textarea').forEach(el => {
      if (el.name || el.id) {
        formData[el.name || el.id] = (el.type === 'checkbox') ? el.checked : el.value;
      }
    });
    localStorage.setItem('swan_draft', JSON.stringify(formData));
    ricalcolaTagliaProgetto();
  }

  function applyDataToForm(data) {
    for (let key in data) {
      const el = document.getElementsByName(key)[0] || document.getElementById(key);
      if (el) {
        if (el.type === 'checkbox') {
          el.checked = data[key];
          if (key.startsWith('f_')) toggleActive(el);
        } else {
          el.value = data[key];
          if (key.startsWith('n_')) checkNote(el);
        }
      }
    }
    handleGlobalERP();
    ricalcolaTagliaProgetto();
  }

  function resumeDraft() {
    const draft = JSON.parse(localStorage.getItem('swan_draft'));
    startNewConfig();
    setTimeout(() => applyDataToForm(draft), 600);
  }

  function startNewConfig() {
    if (!isDataLoaded) { alert("Caricamento moduli in corso..."); return; }
    navTo('main-app', 'up');
    
    // Resetta la Dock e il Drawer ai valori iniziali di partenza
    updateTagliaUI('S', '0.0', '--/--/----');
    
    buildUI(); 
  }

  function resetAndHome() {
    localStorage.removeItem('swan_draft');
    document.getElementById('swanForm').reset();
    document.getElementById('config_id').value = "";
    document.getElementById('nome').readOnly = false;
    document.getElementById('azienda').readOnly = false;
    document.getElementById('builder-container').innerHTML = "";
    document.getElementById('btn-resume-draft').style.display = 'none';
    
    const counterWidget = document.getElementById('swan-counter-widget');
    if (counterWidget) counterWidget.style.display = 'none';

    document.getElementById('compilatore').value = "";
    document.getElementById('compilatore').readOnly = false;
    navTo('landing-page', 'down');
  }

  function ricalcolaTagliaProgetto() {
    if (!configStructure.length) return;
    let giorniTotali = 0;
    const erpGlobaleAttivo = document.getElementById('usa_erp_globale').checked;

    configStructure.forEach(item => {
      const chkFunzione = document.querySelector(`input[name="f_${item.funzione}"]`);
      if (chkFunzione && chkFunzione.checked) {
        let tempoSviluppo = Number(item.sviluppo || 0);
        let tempoDati = Number(item.dati || 0);
        let tempoTest = Number(item.test || 0);

        const chkErp = document.querySelector(`input[name="e_${item.funzione}"]`);
        if (erpGlobaleAttivo && chkErp && chkErp.checked) {
          tempoSviluppo += 1.5; 
        }

        giorniTotali += Math.max(tempoSviluppo, tempoDati) + tempoTest;
      }
    });

    let taglia = "S";
    if (giorniTotali > 10 && giorniTotali <= 25) {
      taglia = "M";
    } else if (giorniTotali > 25) {
      taglia = "L";
    }

    const dataConsegna = calcolaDataMilestone(giorniTotali);
    updateTagliaUI(taglia, giorniTotali.toFixed(1), dataConsegna);
  }

  function calcolaDataMilestone(giorniLavorativi) {
    let dataCorrente = new Date(2026, 6, 21);
    let giorniAggiunti = 0;
    while (giorniAggiunti < giorniLavorativi) {
      dataCorrente.setDate(dataCorrente.getDate() + 1);
      let giornoSettimana = dataCorrente.getDay();
      if (giornoSettimana !== 0 && giornoSettimana !== 6) giorniAggiunti++;
    }
    let milestoneBase = new Date(2026, 8, 7);
    while (dataCorrente > milestoneBase) {
      milestoneBase.setDate(milestoneBase.getDate() + 14);
    }
    return milestoneBase.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' });
  }

  function navTo(targetId, direction) {
    document.querySelectorAll('.page').forEach(p => {
      if(p.id === targetId) p.className = 'page page-visible';
      else p.className = direction === 'up' ? 'page page-hidden-up' : 'page page-hidden-down';
    });
  }

  function toggleRecallBox() {
    const box = document.getElementById('recall-box');
    box.style.display = (box.style.display === 'none') ? 'block' : 'none';
  }

  function handleGlobalERP() {
    const isChecked = document.getElementById('usa_erp_globale').checked;
    document.getElementById('nome_erp_master').style.display = isChecked ? 'block' : 'none';
    document.querySelectorAll('.erp-toggle-wrapper').forEach(w => w.style.display = isChecked ? 'flex' : 'none');
    ricalcolaTagliaProgetto();
  }

  function buildUI() {
    const container = document.getElementById('builder-container');
    container.innerHTML = ""; 
    const areas = {};
    configStructure.forEach(item => {
      if(!areas[item.area]) areas[item.area] = {};
      if(!areas[item.area][item.menu]) areas[item.area][item.menu] = {};
      const skey = (item.sottomenu && item.sottomenu.trim() !== "") ? item.sottomenu : "_DIRECT_";
      if(!areas[item.area][item.menu][skey]) areas[item.area][item.menu][skey] = [];
      areas[item.area][item.menu][skey].push(item);
    });

    let html = '';
    Object.keys(areas).forEach((aName, aIdx) => {
      html += `<div class="area-box">
                <div class="area-header" onclick="toggleArea(this)"><h2>${aName}</h2><span>+</span></div>
                <div class="area-content"><div class="area-inner">`;
      
      Object.keys(areas[aName]).forEach((mName, mIdx) => {
        const mId = `m_${aIdx}_${mIdx}`;
        const subKeys = Object.keys(areas[aName][mName]);
        const isSingleFuncMenu = subKeys.length === 1 && subKeys[0] === "_DIRECT_" && areas[aName][mName]["_DIRECT_"][0].funzione === mName;

        if(isSingleFuncMenu) {
            const f = areas[aName][mName]["_DIRECT_"][0];
            html += renderFunctionRow(f, true); 
        } else {
            html += `<div class="menu-box" id="${mId}">
                      <div class="menu-header">
                        <h3>${mName}</h3>
                        <button type="button" class="btn-select" onclick="selectAll('${mId}', this)">SELEZIONA TUTTO</button>
                      </div>`;
            subKeys.forEach((sName, sIdx) => {
              const sId = `s_${aIdx}_${mIdx}_${sIdx}`;
              if(sName !== "_DIRECT_") {
                html += `<div class="sub-menu-container" id="${sId}">
                          <div class="sub-menu-header">
                            <span class="sub-menu-title">${sName}</span>
                            <button type="button" class="btn-select" onclick="selectAll('${sId}', this)">SELEZIONA TUTTO</button>
                          </div>`;
              } else { html += `<div id="${sId}">`; }
              areas[aName][mName][sName].forEach(f => { html += renderFunctionRow(f, false); });
              html += `</div>`;
            });
            html += `</div>`;
        }
      });
      html += `</div></div></div>`;
    });
    container.innerHTML = html;
    handleGlobalERP();
  }

  function renderFunctionRow(f, isHeaderStyle) {
    let levelHTML = (f.tipo === "speciale") 
      ? `<select name="l_${f.funzione}" class="select-level"><option value="VIEW">VIEW</option><option value="CHECK">CHECK</option><option value="FULL">FULL</option></select>`
      : `<input type="hidden" name="l_${f.funzione}" value="VIEW">`;

    return `
      <div class="func-row-wrapper" style="${isHeaderStyle ? 'margin-bottom:30px; border-bottom:3px solid var(--primary); padding-bottom:15px;' : ''}">
        <div class="func-row-main">
          <input type="checkbox" name="f_${f.funzione}" class="func-checkbox" onchange="toggleActive(this); autoSave();">
          <div class="func-name" style="${isHeaderStyle ? 'font-size:1.1rem; color:var(--primary); text-transform:uppercase; font-weight:800;' : ''}">${f.funzione}</div>
          <div class="func-controls">
            <button type="button" class="btn-note" onclick="toggleNote(this)">NOTE<div class="badge-note"></div></button>
            ${levelHTML}
            <div class="erp-toggle-wrapper">
              <span style="font-size:0.7rem; font-weight:800; color: #2A85A8">ERP</span>
              <label class="switch"><input type="checkbox" name="e_${f.funzione}" onchange="autoSave();"><span class="slider"></span></label>
            </div>
          </div>
        </div>
        <div class="note-container"><textarea name="n_${f.funzione}" rows="2" placeholder="Note..." oninput="checkNote(this); autoSave();"></textarea></div>
      </div>`;
  }

  function toggleArea(h) {
    const c = h.nextElementSibling;
    c.classList.toggle('open');
    h.querySelector('span').innerText = c.classList.contains('open') ? "-" : "+";
  }

  function selectAll(id, btn) {
    const container = document.getElementById(id);
    const cbs = container.querySelectorAll('.func-checkbox');
    if(!cbs.length) return;
    const target = !cbs[0].checked;
    cbs.forEach(cb => { cb.checked = target; toggleActive(cb); });
    btn.classList.toggle('active', target);
    autoSave();
  }

  function toggleActive(cb) {
    cb.closest('.func-row-main').classList.toggle('active', cb.checked);
  }

  function toggleNote(btn) {
    const wrapper = btn.closest('.func-row-wrapper');
    const nt = wrapper.querySelector('.note-container');
    const isNowOpen = nt.style.display !== "block";
    nt.style.display = isNowOpen ? "block" : "none";
    btn.classList.toggle('note-active', isNowOpen);
  }

  function checkNote(tx) {
    const wrapper = tx.closest('.func-row-wrapper');
    const b = wrapper.querySelector('.badge-note');
    b.style.display = (tx.value.trim() !== "") ? "block" : "none";
  }

  // ==========================================
  // SALVATAGGIO & RECUPERO (AZIONI API)
  // ==========================================
  function saveConfiguration() {
    if(!document.getElementById('nome').value || !document.getElementById('azienda').value) { 
      alert("Compila i dati obbligatori (Cliente e Referente)."); 
      return; 
    }
    
    const btnSave = document.getElementById('btn-save');
    btnSave.innerText = "Salvataggio...";
    btnSave.disabled = true;

    const formData = {};
    document.querySelectorAll('#swanForm input, #swanForm select, #swanForm textarea').forEach(el => {
      if (el.name || el.id) {
        formData[el.name || el.id] = (el.type === 'checkbox') ? el.checked : el.value;
      }
    });

    fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify(formData)
    })
    .then(res => res.json())
    .then(resObj => {
      localStorage.removeItem('swan_draft');
      document.getElementById('final-id').innerText = resObj.id || "OK";
      document.getElementById('info-success-box').innerHTML = `PROGETTO TAGLIA: ${resObj.taglia || 'S'}<br>MILESTONE DI GO-LIVE: ${resObj.milestone || '--'}`;
      
      const counterWidget = document.getElementById('swan-counter-widget');
      if (counterWidget) counterWidget.style.display = 'none';

      navTo('success-page', 'up');
    })
    .catch(err => {
      console.error("Errore durante il salvataggio:", err);
      alert("Si è verificato un errore durante il salvataggio.");
    })
    .finally(() => {
      btnSave.innerText = "Salva Configurazione";
      btnSave.disabled = false;
    });
  }

  function doRecall() {
    const code = document.getElementById('recall-input').value.toUpperCase().trim();
    if(!code) {
      alert("Inserisci un codice valido.");
      return;
    }

    fetch(`${API_URL}?action=loadConfigByCode&code=${encodeURIComponent(code)}`, { redirect: 'follow' })
      .then(res => res.json())
      .then(res => {
        if(!res || res.error) { alert("ID non trovato."); return; }
        
        navTo('main-app', 'up');
        
        const counterWidget = document.getElementById('swan-counter-widget');
        if (counterWidget) counterWidget.style.display = 'block';

        buildUI();
        setTimeout(() => {
          applyDataToForm(res);
          document.getElementById('nome').readOnly = true;
          document.getElementById('azienda').readOnly = true;
          document.getElementById('compilatore').value = res.compilatore || '';
          document.getElementById('compilatore').readOnly = true;
        }, 600);
      })
      .catch(err => {
        console.error("Errore recupero configurazione:", err);
        alert("Errore durante il recupero dei dati.");
      });
  }

  function toggleDrawer(open) {
    const overlay = document.getElementById('drawer-overlay');
    const card = document.getElementById('drawer-card');
    if (overlay && card) {
      if (open) {
        overlay.classList.add('active');
        card.classList.add('active');
      } else {
        overlay.classList.remove('active');
        card.classList.remove('active');
      }
    }
  }

  function updateTagliaUI(taglia, sforzo, goLive) {
    const dockTaglia = document.getElementById('dock-taglia-val');
    const dockSforzo = document.getElementById('dock-sforzo-val');
    const drawerTaglia = document.getElementById('drawer-taglia-txt');
    const drawerSforzo = document.getElementById('drawer-sforzo-txt');
    const drawerGoLive = document.getElementById('drawer-golive-txt');

    if (dockTaglia) dockTaglia.innerText = 'Taglia ' + taglia;
    if (dockSforzo) dockSforzo.innerText = sforzo + ' gg';
    if (drawerTaglia) drawerTaglia.innerText = 'Taglia ' + taglia;
    if (drawerSforzo) drawerSforzo.innerText = sforzo + ' gg u.';
    if (drawerGoLive) drawerGoLive.innerText = goLive || 'In definizione';

    if (dockTaglia) {
      if (taglia === 'M') dockTaglia.style.background = '#F59E0B'; 
      else if (taglia === 'L') dockTaglia.style.background = '#EF4444'; 
      else dockTaglia.style.background = '#10B981'; 
    }
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(err => console.log('ServiceWorker registrato parzialmente o fallito', err));
    });
  }
</script>
