<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SWAN Configurator - PWA</title>
  <style>
    :root {
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --bg-main: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
      --success: #22c55e;
      --success-bg: #f0fdf4;
      --success-border: #bbf7d0;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-main); margin: 0; padding: 20px; color: var(--text-main); }
    .container { max-width: 1100px; margin: 0 auto; background: var(--card-bg); border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 30px; }
    
    .header-title { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border-color); padding-bottom: 15px; margin-bottom: 20px; }
    .header-title h1 { margin: 0; color: #0284c7; font-size: 1.8em; }

    /* Form Info Cliente */
    .header-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 25px; background: #f8fafc; padding: 20px; border-radius: 8px; border: 1px solid var(--border-color); }
    .form-group { display: flex; flex-direction: column; }
    .form-group label { font-size: 0.85em; font-weight: 600; color: var(--text-muted); margin-bottom: 5px; }
    .form-group input { padding: 9px 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.95em; outline: none; }
    .form-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.2); }

    /* Barra Caricamento Codice */
    .load-config-bar { background: #e0f2fe; border: 1px dashed var(--primary); padding: 12px 15px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 10px; align-items: center; }
    .load-config-bar input { flex: 1; padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 6px; }
    .btn-secondary { background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-secondary:hover { background: var(--primary-dark); }

    /* Navigazione principale Tab */
    .nav-buttons { display: flex; gap: 15px; margin-bottom: 25px; }
    .btn-nav { flex: 1; padding: 15px; font-size: 1.05em; font-weight: bold; border: 2px solid var(--primary); background: #ffffff; color: var(--primary); border-radius: 8px; cursor: pointer; transition: all 0.2s ease; }
    .btn-nav.active { background: var(--primary); color: #ffffff; }

    .section-content { display: none; }
    .section-content.active { display: block; }

    /* Card Profilazione */
    .card-profilazione { border: 2px solid var(--border-color); border-radius: 8px; margin-bottom: 15px; background: #fff; transition: all 0.3s ease; overflow: hidden; }
    .card-profilazione.completata { border-color: var(--success); background-color: var(--success-bg); }
    .card-header-prof { padding: 15px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: bold; background: #f8fafc; border-bottom: 1px solid var(--border-color); }
    .card-profilazione.completata .card-header-prof { background: var(--success-bg); color: #15803d; border-color: var(--success-border); }
    .card-body-prof { padding: 20px; display: none; }
    .card-body-prof.open { display: block; }
    .badge-status { font-size: 0.85em; padding: 4px 10px; border-radius: 12px; background: #cbd5e1; color: #475569; font-weight: 600; }
    .card-profilazione.completata .badge-status { background: var(--success); color: #fff; }

    /* Struttura Moduli ad Albero Gerarchico */
    .tree-area { border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 20px; padding: 18px; background: #fafafa; }
    .tree-area-title { font-size: 1.15em; font-weight: bold; color: #0f172a; margin-bottom: 10px; padding-bottom: 5px; border-bottom: 2px solid #e2e8f0; }
    .tree-menu { margin-left: 15px; padding-left: 12px; border-left: 2px dashed #cbd5e1; margin-top: 12px; }
    .tree-menu-title { font-size: 1em; font-weight: 700; color: #334155; }
    .tree-sottomenu { margin-left: 15px; margin-top: 10px; }
    .tree-sottomenu-title { font-size: 0.9em; font-weight: 600; color: #64748b; font-style: italic; margin-bottom: 6px; }
    
    .tree-funzione { margin-left: 15px; background: #ffffff; padding: 12px 15px; border: 1px solid var(--border-color); border-radius: 6px; margin-top: 8px; display: flex; justify-content: space-between; align-items: center; gap: 15px; flex-wrap: wrap; }
    .tree-funzione:hover { border-color: var(--primary); }
    .tree-funzione-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 250px; }
    .tree-funzione-controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .tree-funzione-controls select { padding: 4px 8px; border-radius: 4px; border: 1px solid var(--border-color); font-size: 0.85em; }
    .tree-funzione-controls input[type="text"] { padding: 4px 8px; border-radius: 4px; border: 1px solid var(--border-color); font-size: 0.85em; width: 160px; }

    /* Bar KPI e Pulsanti Salva Sticky */
    .kpi-bar { position: sticky; bottom: 20px; background: #0f172a; color: white; padding: 15px 25px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-top: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); z-index: 100; flex-wrap: wrap; gap: 15px; }
    .kpi-info { display: flex; gap: 20px; align-items: center; font-size: 0.95em; }
    .kpi-val { color: #38bdf8; font-weight: bold; font-size: 1.2em; }
    .kpi-taglia { color: #facc15; font-weight: bold; font-size: 1.2em; }
    .btn-salva { background: var(--success); color: white; border: none; padding: 12px 24px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 1em; transition: background 0.2s; }
    .btn-salva:hover { background: #16a34a; }
  </style>
</head>
<body>

<div class="container">
  <div class="header-title">
    <h1>SWAN Configurator</h1>
    <span id="label-config-id" style="font-weight: bold; color: var(--text-muted); font-size: 0.9em;"></span>
  </div>

  <!-- Caricamento tramite Codice ID -->
  <div class="load-config-bar">
    <span>Hai già un codice configurazione?</span>
    <input type="text" id="input_search_code" placeholder="Es: SWAN-123456">
    <button class="btn-secondary" onclick="caricaConfigurazioneDaCodice()">Carica</button>
  </div>
  
  <!-- Dati Cliente -->
  <div class="header-info">
    <div class="form-group">
      <label>Azienda / Ragione Sociale *</label>
      <input type="text" id="info_azienda" placeholder="Nome Azienda">
    </div>
    <div class="form-group">
      <label>Nome Referente Contatto</label>
      <input type="text" id="info_nome" placeholder="Nome e Cognome">
    </div>
    <div class="form-group">
      <label>Compilatore Scheda</label>
      <input type="text" id="info_compilatore" placeholder="Nome Compilatore">
    </div>
    <div class="form-group">
      <label>Email Recapito PDF *</label>
      <input type="email" id="info_email" placeholder="email@azienda.it">
    </div>
  </div>

  <!-- Navigazione Moduli / Profilazione -->
  <div class="nav-buttons">
    <button class="btn-nav active" id="tab-prof-btn" onclick="mostraSezione('profilazione')">1. Profilazione Clienti</button>
    <button class="btn-nav" id="tab-mod-btn" onclick="mostraSezione('moduli')">2. Configurazione Moduli</button>
  </div>

  <!-- Sezione 1: Profilazione (Card per Argomento) -->
  <div id="sezione-profilazione" class="section-content active">
    <h3>Profilazione Tecnica & Requisiti</h3>
    <div id="profilazione-container">Caricamento schede profilazione...</div>
  </div>

  <!-- Sezione 2: Moduli (Albero Albero Completo) -->
  <div id="sezione-moduli" class="section-content">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; background: #e0f2fe; padding: 12px 18px; border-radius: 8px;">
      <h3 style="margin:0; color:#0369a1;">Struttura Moduli & Funzionalità</h3>
      <label style="font-weight: bold; cursor: pointer; color:#0369a1;">
        <input type="checkbox" id="usa_erp_globale" onchange="ricalcolaTotali()"> Abilita Integrazione ERP Globale
      </label>
    </div>
    <div id="moduli-container">Caricamento moduli in corso...</div>
  </div>

  <!-- KPI Bar Sticky In Basso -->
  <div class="kpi-bar">
    <div class="kpi-info">
      <div>Sforzo Totale: <span class="kpi-val" id="kpi-giorni">0.0</span> <small>gg u.</small></div>
      <div>Taglia Progetto: <span class="kpi-taglia" id="kpi-taglia">S</span></div>
      <div>Milestone Stimata: <strong id="kpi-milestone" style="color:#fff;">-</strong></div>
    </div>
    <button class="btn-salva" onclick="salvaTutto()">Salva & Invia Configurazione</button>
  </div>
</div>

<script>
  // ==========================================
  // CONFIGURAZIONE API URL
  // ==========================================
  // Inserire l'URL completo restituito dopo la pubblicazione di Apps Script
  const API_URL = "INSERISCI_QUI_IL_TUO_URL_WEB_APP";

  let configStructure = [];
  let profilazioneData = [];
  let currentConfigId = "";

  window.onload = function() {
    // Controlla se c'è un ID configurazione nell'URL (es: ?code=SWAN-123456)
    const urlParams = new URLSearchParams(window.location.search);
    const codeFromUrl = urlParams.get('code') || urlParams.get('configId');

    caricaDati(codeFromUrl);
  };

  async function caricaDati(codeToLoad = null) {
    try {
      let fetchUrl = API_URL;
      if (codeToLoad) {
        fetchUrl += `?action=loadConfigByCode&code=${encodeURIComponent(codeToLoad)}`;
      }

      const res = await fetch(fetchUrl);
      const data = await res.json();
      
      if (data.status === "success") {
        if (codeToLoad && data.config_id) {
          ripristinaConfigurazioneEsistente(data);
        } else {
          configStructure = data.struttura || [];
          profilazioneData = data.profilazione || [];
          
          renderProfilazioneCards(profilazioneData);
          renderConfigurazioneModuli(configStructure);
        }
      } else {
        alert("Errore caricamento dati server: " + data.message);
      }
    } catch (err) {
      console.error("Errore di connessione API:", err);
    }
  }

  function mostraSezione(sezione) {
    document.querySelectorAll('.section-content').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.btn-nav').forEach(b => b.classList.remove('active'));

    if (sezione === 'profilazione') {
      document.getElementById('sezione-profilazione').classList.add('active');
      document.getElementById('tab-prof-btn').classList.add('active');
    } else {
      document.getElementById('sezione-moduli').classList.add('active');
      document.getElementById('tab-mod-btn').classList.add('active');
    }
  }

  // --- 1. RENDER PROFILAZIONE (CARD PER ARGOMENTO) ---
  function renderProfilazioneCards(data) {
    const container = document.getElementById("profilazione-container");
    container.innerHTML = "";

    if (!data || data.length === 0) {
      container.innerHTML = "<p style='color: var(--text-muted);'>Nessuna domanda di profilazione configurata sul foglio 'Profilazione'.</p>";
      return;
    }

    const gruppi = {};
    data.forEach(item => {
      const argomento = item.argomento || "Generale";
      if (!gruppi[argomento]) gruppi[argomento] = [];
      gruppi[argomento].push(item);
    });

    Object.keys(gruppi).forEach((argomento, idx) => {
      const domande = gruppi[argomento];
      const cardId = `card_prof_${idx}`;
      
      let htmlDomande = domande.map((d, dIdx) => `
        <div style="margin-bottom: 15px;">
          <label style="display:block; font-weight:600; margin-bottom: 6px; font-size: 0.95em;">${d.domanda || d.titolo || 'Domanda'}</label>
          <input type="text" 
                 name="prof_${idx}_${dIdx}" 
                 data-domanda="${d.domanda || d.titolo}"
                 class="input-profilazione" 
                 data-card="${cardId}" 
                 oninput="verificaCompletamentoCard('${cardId}')" 
                 style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px;">
        </div>
      `).join('');

      const cardHTML = `
        <div class="card-profilazione" id="${cardId}">
          <div class="card-header-prof" onclick="toggleCard('${cardId}')">
            <span>📋 ${argomento}</span>
            <span class="badge-status" id="${cardId}_status">Da completare</span>
          </div>
          <div class="card-body-prof" id="${cardId}_body">
            ${htmlDomande}
          </div>
        </div>
      `;
      container.innerHTML += cardHTML;
    });
  }

  function toggleCard(cardId) {
    const body = document.getElementById(`${cardId}_body`);
    body.classList.toggle("open");
  }

  function verificaCompletamentoCard(cardId) {
    const card = document.getElementById(cardId);
    const inputs = card.querySelectorAll(".input-profilazione");
    const badge = document.getElementById(`${cardId}_status`);
    
    let tutteCompilate = true;
    inputs.forEach(input => {
      if (!input.value.trim()) tutteCompilate = false;
    });

    if (tutteCompilate && inputs.length > 0) {
      card.classList.add("completata");
      badge.innerText = "✔ Completato";
    } else {
      card.classList.remove("completata");
      badge.innerText = "Da completare";
    }
  }

  // --- 2. RENDER MODULI (ALBERO DETTAGLIATO) ---
  function renderConfigurazioneModuli(data) {
    const container = document.getElementById("moduli-container");
    container.innerHTML = "";

    const albero = {};
    data.forEach(row => {
      const area = row.area || "Generale";
      const menu = row.menu || "Base";
      const sottomenu = row.sottomenu || "";

      if (!albero[area]) albero[area] = {};
      if (!albero[area][menu]) albero[area][menu] = {};
      if (!albero[area][menu][sottomenu]) albero[area][menu][sottomenu] = [];

      albero[area][menu][sottomenu].push(row);
    });

    Object.keys(albero).forEach(area => {
      let areaHTML = `<div class="tree-area"><div class="tree-area-title">📁 Area: ${area}</div>`;
      
      Object.keys(albero[area]).forEach(menu => {
        areaHTML += `<div class="tree-menu"><div class="tree-menu-title">📌 Menu: ${menu}</div>`;
        
        Object.keys(albero[area][menu]).forEach(sottomenu => {
          if (sottomenu !== "") {
            areaHTML += `<div class="tree-sottomenu"><div class="tree-sottomenu-title">🔹 Sottomenu: ${sottomenu}</div>`;
          } else {
            areaHTML += `<div class="tree-sottomenu">`;
          }
          
          albero[area][menu][sottomenu].forEach(item => {
            const safeFnId = "fn_" + item.funzione.replace(/[^a-zA-Z0-9]/g, "_");
            
            areaHTML += `
              <div class="tree-funzione">
                <div class="tree-funzione-left">
                  <input type="checkbox" 
                         class="chk-funzione" 
                         data-sviluppo="${item.sviluppo || 0}" 
                         data-dati="${item.dati || 0}" 
                         data-test="${item.test || 0}"
                         data-area="${area}"
                         data-menu="${menu}"
                         data-sottomenu="${sottomenu}"
                         data-funzione="${item.funzione}"
                         id="${safeFnId}"
                         onchange="ricalcolaTotali()">
                  <label for="${safeFnId}" style="cursor:pointer;"><strong>${item.funzione}</strong></label>
                </div>
                
                <div class="tree-funzione-controls">
                  <select id="perm_${safeFnId}">
                    <option value="VIEW">Permesso: VIEW</option>
                    <option value="EDIT">Permesso: EDIT</option>
                    <option value="ALL">Permesso: ALL</option>
                  </select>

                  <label style="font-size:0.85em; cursor:pointer;">
                    <input type="checkbox" class="chk-erp" id="erp_${safeFnId}" onchange="ricalcolaTotali()"> ERP Integration
                  </label>

                  <input type="text" id="note_${safeFnId}" placeholder="Note particolari...">
                </div>
              </div>
            `;
          });
          areaHTML += `</div>`;
        });
        areaHTML += `</div>`;
      });
      areaHTML += `</div>`;
      container.innerHTML += areaHTML;
    });
  }

  // --- 3. CALCOLO LIVE TEMPI E TAGLIA ---
  function ricalcolaTotali() {
    let totaleSviluppo = 0;
    let totaleDati = 0;
    let totaleTest = 0;
    let conteggioErp = 0;

    const erpGlobaleAttivo = document.getElementById('usa_erp_globale').checked;
    const funzioni = document.querySelectorAll('.chk-funzione:checked');

    funzioni.forEach(chk => {
      totaleSviluppo += Number(chk.dataset.sviluppo || 0);
      totaleDati += Number(chk.dataset.dati || 0);
      totaleTest += Number(chk.dataset.test || 0);

      const chkErp = document.getElementById(`erp_${chk.id}`);
      if (erpGlobaleAttivo && chkErp && chkErp.checked) {
        conteggioErp++;
      }
    });

    const tempoBase = totaleSviluppo + totaleDati + totaleTest;
    const tempoErpExtra = conteggioErp * 1.0;
    const giorniTotali = tempoBase + tempoErpExtra;

    let taglia = "S";
    if (giorniTotali > 10 && giorniTotali <= 25) {
      taglia = "M";
    } else if (giorniTotali > 25) {
      taglia = "L";
    }

    // Calcolo Milestone di Rilascio
    let dataMilestone = new Date();
    dataMilestone.setDate(dataMilestone.getDate() + 14);

    document.getElementById('kpi-giorni').innerText = giorniTotali.toFixed(1);
    document.getElementById('kpi-taglia').innerText = taglia;
    document.getElementById('kpi-milestone').innerText = dataMilestone.toLocaleDateString('it-IT');
  }

  // --- 4. SALVATAGGIO CONFIGURAZIONE ---
  async function salvaTutto() {
    const azienda = document.getElementById('info_azienda').value.trim();
    const email = document.getElementById('info_email').value.trim();

    if (!azienda || !email) {
      alert("⚠️ Attenzione: I campi Azienda ed Email sono obbligatori per procedere!");
      return;
    }

    const payload = {
      config_id: currentConfigId,
      azienda: azienda,
      nome: document.getElementById('info_nome').value,
      compilatore: document.getElementById('info_compilatore').value,
      email: email,
      usa_erp_globale: document.getElementById('usa_erp_globale').checked,
      profilazioneRisposte: {}
    };

    // Lettura Profilazione
    document.querySelectorAll('.input-profilazione').forEach(input => {
      const domanda = input.dataset.domanda || input.name;
      payload.profilazioneRisposte[domanda] = input.value;
    });

    // Lettura Moduli selezionati
    document.querySelectorAll('.chk-funzione').forEach(chk => {
      const safeFnId = chk.id;
      const fnName = chk.dataset.funzione;
      const isChecked = chk.checked;
      
      payload['f_' + fnName] = isChecked;
      if (isChecked) {
        const chkErp = document.getElementById(`erp_${safeFnId}`);
        const selectPerm = document.getElementById(`perm_${safeFnId}`);
        const inputNote = document.getElementById(`note_${safeFnId}`);

        payload['e_' + fnName] = chkErp ? chkErp.checked : false;
        payload['l_' + fnName] = selectPerm ? selectPerm.value : "VIEW";
        payload['n_' + fnName] = inputNote ? inputNote.value : "";
      }
    });

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });
      const result = await res.json();
      
      if (result.status === "success") {
        currentConfigId = result.id;
        document.getElementById('label-config-id').innerText = "Codice: " + currentConfigId;
        alert(`✅ Configurazione salvata con successo!\nCodice ID: ${result.id}\nEmail di recap inviata a ${email}`);
      } else {
        alert("❌ Errore durante il salvataggio: " + result.message);
      }
    } catch (err) {
      alert("❌ Errore di comunicazione con il server: " + err.toString());
    }
  }

  // --- 5. CARICAMENTO CONFIGURAZIONE DA CODICE ---
  async function caricaConfigurazioneDaCodice() {
    const code = document.getElementById('input_search_code').value.trim();
    if (!code) {
      alert("Inserire un codice di configurazione valido!");
      return;
    }
    caricaDati(code);
  }

  function ripristinaConfigurazioneEsistente(data) {
    currentConfigId = data.config_id || "";
    document.getElementById('label-config-id').innerText = "Codice: " + currentConfigId;
    
    document.getElementById('info_azienda').value = data.azienda || data.cliente || "";
    document.getElementById('info_nome').value = data.nome || data.referente || "";
    document.getElementById('info_compilatore').value = data.compilatore || "";
    document.getElementById('info_email').value = data.email || "";

    if (data.usa_erp_globale !== undefined) {
      document.getElementById('usa_erp_globale').checked = (data.usa_erp_globale === true || data.usa_erp_globale === "true");
    }

    // Ripristino Profilazione
    if (data.profilazioneRisposte) {
      document.querySelectorAll('.input-profilazione').forEach(input => {
        const domanda = input.dataset.domanda || input.name;
        if (data.profilazioneRisposte[domanda] !== undefined) {
          input.value = data.profilazioneRisposte[domanda];
          const cardId = input.dataset.card;
          if (cardId) verificaCompletamentoCard(cardId);
        }
      });
    }

    // Ripristino Moduli
    document.querySelectorAll('.chk-funzione').forEach(chk => {
      const fnName = chk.dataset.funzione;
      const safeFnId = chk.id;
      
      if (data['f_' + fnName] === true || data['f_' + fnName] === "true") {
        chk.checked = true;
        
        const chkErp = document.getElementById(`erp_${safeFnId}`);
        if (chkErp) chkErp.checked = (data['e_' + fnName] === true || data['e_' + fnName] === "true");

        const selectPerm = document.getElementById(`perm_${safeFnId}`);
        if (selectPerm && data['l_' + fnName]) selectPerm.value = data['l_' + fnName];

        const inputNote = document.getElementById(`note_${safeFnId}`);
        if (inputNote && data['n_' + fnName]) inputNote.value = data['n_' + fnName];
      }
    });

    ricalcolaTotali();
    alert("✅ Configurazione " + currentConfigId + " caricata con successo!");
  }
</script>
</body>
</html>
